[project]
name = "yggdrasil"
dynamic = ["version"]
authors = [
    { name = "Anastasios Glaros", email = "anastasios.glaros@scilifelab.se" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "appdirs==1.4.4",
    "cattrs==26.2.1",
    "ibmcloudant>=0.10.6",
    "panzi_json_logic==1.0.1",
    "requests>=2.31.0",
    "rich==14.0.0",
    "watchdog==6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.8",
    "black>=24.8.0",
    "mypy>=1.11.2",
    "coverage>=7.0",
    "pip-tools",
    "pre-commit",
    "setuptools-scm",
    "types-requests"
]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.4",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP"
]
ignore = [
    "E402",
    "E501",
    "E722",
    "E741"
]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "normal"
check_untyped_defs = false
exclude = [
    "trashcan/.*",
    "htmlcov/.*",
    "sim_out/.*",
]

[project.scripts]
yggdrasil = "yggdrasil.cli:main"

[project.entry-points."ygg.realm"]
# Unified realm discovery - provides handlers + watchspecs
test_realm = "lib.realms.test_realm:get_realm_descriptor"

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yggdrasil", "lib"]

[tool.setuptools.package-data]
yggdrasil = ["assets/*", "py.typed"]

[tool.setuptools_scm]
version_scheme = "post-release"