default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff
        args: [ --fix, --exit-zero ]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      # Commit-time: check staged files only (fast, catches local errors)
      - id: mypy
        name: mypy (staged files)
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - types-requests

      # Push-time: full-project check (same config as CI)
      - id: mypy
        name: mypy (full project)
        args: [--config-file=pyproject.toml, .]
        pass_filenames: false
        additional_dependencies:
          - types-requests
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pip-compile-lock
        name: Re-generate requirements/lock.txt
        entry: pip-compile --strip-extras -o requirements/lock.txt
        language: python
        additional_dependencies: ["pip-tools"]
        pass_filenames: false

      - id: pytest-full
        name: pytest (full suite)
        entry: python -m pytest --ignore=trashcan -q
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-merge-conflict

